name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Set iOS deployment target
        run: |
          # Generate Flutter's Podfile before CocoaPods runs, then ensure it
          # uses the same minimum iOS version as the Xcode target.
          flutter build ios --release --no-codesign --config-only
          test -f ios/Podfile
          if grep -q "^platform :ios" ios/Podfile; then
            sed -i '' "s/^platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          else
            printf "platform :ios, '15.0'\n" | cat - ios/Podfile > ios/Podfile.tmp
            mv ios/Podfile.tmp ios/Podfile
          fi

      - name: Disable Code Signing Requirements
        run: |
          echo "CODE_SIGNING_REQUIRED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY = " >> ios/Flutter/Release.xcconfig
          echo "EXPANDED_CODE_SIGN_IDENTITY = " >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM = XXXXXXXXXX" >> ios/Flutter/Release.xcconfig

      - name: Build iOS App (No Code Sign)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r buolot_man_app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buolot-man-ios-unsigned
          path: buolot_man_app.ipa
          retention-days: 7
