name: Build BoulotMan mobile

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Configure Firebase key
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "${FIREBASE_API_KEY:-}" ]; then
            echo "FIREBASE_API_KEY GitHub secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("android/app/google-services.json")
          text = path.read_text()
          path.write_text(text.replace("__FIREBASE_API_KEY__", os.environ["FIREBASE_API_KEY"]))
          PY
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: boulotman-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Configure Firebase key
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "${FIREBASE_API_KEY:-}" ]; then
            echo "FIREBASE_API_KEY GitHub secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("ios/Runner/GoogleService-Info.plist")
          text = path.read_text()
          path.write_text(text.replace("__FIREBASE_API_KEY__", os.environ["FIREBASE_API_KEY"]))
          PY
      - run: flutter pub get
      - name: Configure Maps key
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: echo "GOOGLE_MAPS_API_KEY = $GOOGLE_MAPS_API_KEY" > ios/Flutter/Secrets.xcconfig
      - run: flutter build ipa --release --no-codesign --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: boulotman-ios-ipa-unsigned
          path: build/ios/ipa/*.ipa
